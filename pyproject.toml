[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "porous-airfoil-panel-method"
version = "0.1.0"
description = "Source-vortex panel method coupled to fixed porous airfoil channel models."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Project author" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
acceleration = ["numba>=0.58"]
dev = ["ruff>=0.4", "pytest>=8.0"]

[project.scripts]
porous-airfoil = "run_porous_models:main"

[tool.hatch.build.targets.wheel]
py-modules = [
  "run",
  "run_porous_models",
  "porous_config",
  "porous_core",
  "solver",
  "plotter",
  "paraview_export",
  "xfoil",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
